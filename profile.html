<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profile — УУДАМ CARGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="logo-word">УУДАМ <span>CARGO</span></div>
  </a>
  <nav>
    <a href="index.html">Нүүр</a>
    <a href="calculator.html">Тооцоолуур</a>
    <a href="about.html">Бидний тухай</a>
  </nav>
  <div class="header-actions">
    <button id="loginButton" class="user-button" aria-label="Нэвтрэх эсвэл профайл нээх">
      <span class="user-icon" aria-hidden="true"></span>
      <span class="user-label">Нэвтрэх</span>
    </button>
    <button class="hdr-cta" onclick="document.getElementById('contact')?.scrollIntoView()">Хаяг холбох</button>
  </div>
</header>

<div id="loginModal" class="auth-modal" aria-hidden="true">
  <div class="auth-modal-backdrop" data-close="auth-modal"></div>
  <div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <button class="auth-close" data-close="auth-modal" aria-label="Нэвтрэх цонх хаах">×</button>
    <div class="auth-header">
      <div class="auth-avatar">👤</div>
      <div>
        <p class="auth-crumb">Нэвтрэх</p>
        <h3 id="loginTitle">Хэрэглэгчийн нэвтрэлт</h3>
      </div>
    </div>

    <div class="auth-form">
      <label for="phoneInput">Утасны дугаар</label>
      <input id="phoneInput" type="tel" placeholder="+976 9911-2233" inputmode="tel">
      <button id="sendOtpBtn" class="primary-btn">Код илгээх</button>

      <div id="otpStep" class="otp-step">
        <label for="otpInput">Баталгаажуулах код</label>
        <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 оронтой код оруулна уу">
        <div id="authStatus" class="auth-status" aria-live="polite"></div>
        <div class="auth-actions">
          <button id="verifyOtpBtn" class="primary-btn">Баталгаажуулж нэвтрэх</button>
          <button id="resendOtpBtn" class="secondary-btn" type="button">Дахин илгээх</button>
        </div>
      </div>
    </div>
  </div>
</div>

<main class="profile-page">
  <section class="profile-shell">
    <div class="profile-summary">
      <div class="profile-avatar-large">U</div>
      <div>
        <p class="eyebrow">Профайл</p>
        <h1>Миний бүртгэл</h1>
      </div>
    </div>

    <div class="profile-card">
      <div class="info-row">
        <span class="label">Утас</span>
        <strong id="profilePhone">—</strong>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Гарах</button>
    </div>

    <div class="shipments-panel">
      <div class="shipments-header">
        <h2>Ачааны жагсаалт</h2>
      </div>
      <div id="shipmentsList" class="shipments-list"></div>
    </div>
  </section>
</main>

<footer>© 2026 Uudam Cargo — Профайл</footer>

<script src="auth.js"></script>
</body>
</html>
